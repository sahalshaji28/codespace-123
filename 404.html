<!DOCTYPE html>

  <style>

      50% { transform: translateY(-10px); }

          🚀 Take Me Back Home

          <span class="font-medium text-blue-400 block sm:inline"><!--email_off-->22f1001643@ds.study.iitm.ac.in<!--/email_off--></span>

    </div>
  </div>
</body>
